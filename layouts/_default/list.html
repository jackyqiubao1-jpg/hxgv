{{ define "main" }}
<div class="page-wrap">
  <div class="container narrow">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <div class="post-list">
    {{ range .Pages }}
      <article class="post-item">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <time>{{ .Date.Format "2006-01-02" }}</time>
        <p>{{ .Summary }}</p>
      </article>
    {{ end }}
    </div>
  </div>
</div>
{{ end }}
